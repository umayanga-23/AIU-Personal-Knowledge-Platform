spring:
  application:
    name: portfolio-backend-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

supabase:
  url: https://test.supabase.co
  publishable-key: test-publishable-key
  service-role-key: test-service-role-key
  jwt-secret: test-jwt-secret-key-must-be-long-enough-for-hs256-validation-signature-minimum-256-bits-long

app:
  cors:
    allowed-origins: http://localhost:3000
