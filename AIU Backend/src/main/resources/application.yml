spring:
  application:
    name: portfolio-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?stringtype=unspecified&sslmode=require
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-stacktrace: never
    include-message: always

supabase:
  url: ${SUPABASE_URL:https://localhost.supabase.co}
  publishable-key: ${SUPABASE_PUBLISHABLE_KEY:placeholder-anon-key}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:placeholder-service-key}
  jwt-secret: ${SUPABASE_JWT_SECRET:placeholder-jwt-secret-key-must-be-long-enough-for-hs256-validation-signature}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
